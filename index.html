<h1>rclone-ev</h1>
<p>rclone-ev is a private, single-user tool. It lets the owner's home server back up the owner's own files to the owner's own Google Drive using <a href="https://rclone.org">rclone</a>.</p>
<p>It is not offered to the public and has no other users.</p>
